version: 2

# Dependabot covers GitHub Actions only. Scala dependencies belong to Scala
# Steward (.github/workflows/scala-steward.yml), which understands sbt builds,
# cross-versioned artifacts and Scala's binary-compatibility rules.
#
# The split is clean by construction rather than by configuration: Dependabot
# has no sbt ecosystem at all, so it cannot see anything in build.sbt or
# project/build.properties even if asked. There is consequently nothing to
# exclude here and no risk of the two bots opening competing pull requests —
# which is also why this file lists one ecosystem rather than listing many and
# ignoring most.
#
# The one thing Dependabot does that Steward does not is keep the `uses:` pins
# in the workflows current, including Steward's own action.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      # Stated rather than inferred. Steward's cron is UTC by Actions'
      # definition; Dependabot reads `time` in this timezone, which defaults to
      # Etc/UTC. Both land in the same slot today, but leaving it implicit means
      # a changed default would separate them with no signal.
      timezone: "Etc/UTC"

    # Version updates all collapse into the single group below, so this bites
    # only if something fails to group.
    open-pull-requests-limit: 1

    labels:
      - "dependencies"

    # Majors only, because every `uses:` in this repository is a floating major
    # tag -- `checkout@v7`, `setup-java@v5`, `setup-sbt@v1`,
    # `scala-steward-action@v2`. A patch or minor release is picked up by those
    # tags at run time with no pull request needed, so proposing one is asking
    # for a commit that changes nothing about what actually runs.
    #
    # It is not hypothetical noise: scala-steward-action has 102 releases in
    # v2.x, and Dependabot opened a pull request to pin `@v2` to `@v2.92.0`.
    # Taking it would have made that action the only patch-pinned one here and
    # produced a pull request per release from then on -- against an
    # `open-pull-requests-limit` of 1, which is what would have crowded out the
    # major bumps this ecosystem exists to catch.
    #
    # A major bump is a different thing: `@v2` does not follow the action to v3,
    # so that one genuinely needs a commit, and it survives this filter.
    #
    # Security updates are unaffected in substance. `ignore` suppresses the pull
    # request, but a patch-level fix reaches the workflow through the floating
    # tag on the next run regardless -- which is the property that makes floating
    # majors worth the trade in the first place.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

    # No `commit-message.prefix`: Dependabot prepends a prefix to its own
    # subject rather than replacing the verb, so "Update" would yield
    # "Update: bump the actions group with N updates" — a doubled verb. Its
    # default subject is already imperative and matches the surrounding history.

    groups:
      # Actions move together often enough that separate PRs are mostly noise;
      # a single grouped PR either builds or does not.
      #
      # Two entries because a group applies to version updates only unless told
      # otherwise, and security advisories are exactly the case where several
      # actions do move at once.
      actions:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
