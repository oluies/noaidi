version: 2

# Dependabot covers GitHub Actions only. Scala dependencies belong to Scala
# Steward (.github/workflows/scala-steward.yml), which understands sbt builds,
# cross-versioned artifacts and Scala's binary-compatibility rules.
#
# The split is clean by construction rather than by configuration: Dependabot
# has no sbt ecosystem at all, so it cannot see anything in build.sbt or
# project/build.properties even if asked. There is consequently nothing to
# exclude here and no risk of the two bots opening competing pull requests —
# which is also why this file lists one ecosystem rather than listing many and
# ignoring most.
#
# The one thing Dependabot does that Steward does not is keep the `uses:` pins
# in the workflows current, including Steward's own action.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      # Stated rather than inferred. Steward's cron is UTC by Actions'
      # definition; Dependabot reads `time` in this timezone, which defaults to
      # Etc/UTC. Both land in the same slot today, but leaving it implicit means
      # a changed default would separate them with no signal.
      timezone: "Etc/UTC"

    # Version updates all collapse into the single group below, so this bites
    # only if something fails to group.
    open-pull-requests-limit: 1

    labels:
      - "dependencies"

    # Majors only, for the actions listed below. Each of them is referenced by a
    # floating major tag, so a patch or minor release reaches the workflow at run
    # time with no pull request needed -- proposing one asks for a commit that
    # changes nothing about what actually runs. Dependabot opened one such pull
    # request to pin `scala-steward-action@v2` to an exact patch; that action has
    # had dozens of releases in its current major, and against an
    # `open-pull-requests-limit` of 1 the stream would crowd out the major bumps
    # this ecosystem exists to catch.
    #
    # A major bump is a different thing: `@v2` does not follow the action to v3,
    # so it genuinely needs a commit, and it survives this filter.
    #
    # ==Named rather than `*`, on purpose==
    #
    # The argument above holds only for an action pinned to a floating major. An
    # action pinned to a SHA or an exact version -- the usual supply-chain
    # hardening advice -- gets no fix at run time, so silently freezing it would
    # be the opposite of what is wanted. Listing them by name makes that the
    # default: an action added later falls outside the filter and keeps getting
    # pull requests until someone puts it here.
    #
    # '''Every action listed here must be pinned to a floating major tag.'''
    # `.github/scripts/check_action_pins.py` enforces that in CI and fails the
    # build if it stops being true. Leaving a *new* floating-major action out is
    # a warning rather than an error: nothing breaks, Dependabot simply proposes
    # patch bumps that change nothing at run time. The two directions are not
    # equally bad, so they are not treated the same.
    #
    # ==What this costs on security advisories==
    #
    # More than the first version of this comment claimed. `ignore` has no
    # `applies-to`, so it suppresses security updates as well as version updates.
    # Action advisories are usually fixed in a patch or minor release, so for the
    # actions listed there the *pull request* will not appear.
    #
    # The fix itself still arrives -- that is what a floating major tag does --
    # but the notification does not, and those are different things. Accepted
    # deliberately: with the fix landing automatically, the alert would be
    # telling us about work already done. See the `groups` note below, which
    # covers what remains of `actions-security` under this rule.
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "actions/setup-java"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "sbt/setup-sbt"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "scala-steward-org/scala-steward-action"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "actions/setup-python"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]

    # No `commit-message.prefix`: Dependabot prepends a prefix to its own
    # subject rather than replacing the verb, so "Update" would yield
    # "Update: bump the actions group with N updates" — a doubled verb. Its
    # default subject is already imperative and matches the surrounding history.

    groups:
      # Actions move together often enough that separate PRs are mostly noise;
      # a single grouped PR either builds or does not.
      #
      # Two entries because a group applies to version updates only unless told
      # otherwise, and security advisories are exactly the case where several
      # actions do move at once.
      #
      # `actions-security` is kept, but the `ignore` block above narrows what can
      # reach it. For the actions listed there it now fires only on an advisory
      # whose fix lands in a new *major*, since patch and minor are suppressed
      # for security updates as well as version ones. It stays open at every
      # level for any action *not* listed -- which is the case the named list was
      # written to leave room for, since a SHA-pinned action gets no run-time fix
      # and its advisory has to arrive as a pull request or not at all.
      actions:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
