name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run on demand, e.g. to confirm a flake or to rebuild after a secret
  # changes. Scala Steward's own updates arrive as pull requests and are covered
  # by the trigger above.
  workflow_dispatch:
    inputs:
      wedge_kernel_pass:
        description: >-
          Hang one kernel-split invocation on purpose, to prove the watchdog
          fires. Give a pass number (1-7); empty means normal. The watchdog's
          firing path has only ever been exercised by a local emulation of
          `timeout`, so on a real runner it is untested -- and this job's whole
          history is of instrumentation that looked right and produced nothing
          when it mattered. This makes that one dispatch away.
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Conventions this repository relies on that no compiler or linter enforces.
  # Both checks here are for defects that leave the build green, which is the
  # only reason either needs to exist.
  #
  #   action pins   `.github/dependabot.yml` suppresses patch and minor updates
  #                 for a named set of actions. That is sound only while each is
  #                 pinned to a floating major tag: a SHA or exact pin gets no fix
  #                 at run time, so ignoring its updates freezes it for ever.
  #
  #   orphan docs   Scala attaches only the doc comment immediately above a
  #                 definition. A stack of two drops the first in silence, and it
  #                 lands when a definition moves and its comment is left behind.
  #
  # The logic lives in scripts rather than heredocs so each can be run against a
  # working tree before pushing, and so they can be read.
  #
  # The job keeps its `action-pins` id because nothing gains by churning it, but
  # the id is not what carries a check's identity: GitHub derives the status
  # context from `name:`, so the rename below *did* retire the old
  # "Dependabot ignore list matches the workflows" context and start a new one.
  # That is safe here only because `main` has no branch protection and so no
  # required check to strand -- verified rather than assumed. Adding protection
  # later means naming the context below, not this id.
  action-pins:
    name: Source checks the compiler does not make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PyYAML is not part of the runner image's contract, and PEP 668 on 24.04
      # makes a system `pip install` fail without `--break-system-packages`. A
      # pinned interpreter with an explicit install is one less thing to be
      # surprised by.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Pinned exactly. A job whose whole subject is pinning discipline should
      # not install its own dependency unpinned. Dependabot does not manage it:
      # there is no `pip` ecosystem here, and adding one to track a single
      # build-time package would pull every future Python dependency into a
      # config that exists for GitHub Actions. Bump it by hand when it matters.
      - run: pip install pyyaml==6.0.3

      # The check, and the tests for the check. The logic is glob matching, tree
      # walking and a set comparison, and its failure mode is passing while the
      # invariant it names is broken -- so the tests run first.
      - run: python3 .github/scripts/test_check_action_pins.py

      - run: python3 .github/scripts/check_action_pins.py

      # Orphaned doc comments. Scala attaches only the comment immediately above
      # a definition, so a stack of two silently drops the first -- and the
      # compiler, `-Wunused:all` and scaladoc all accept it without a word, which
      # is why this needs a check of its own rather than a compiler flag.
      #
      # It rides in this job rather than its own because it needs no dependency
      # beyond the interpreter already set up above, and a second runner to walk
      # 94 files would cost more to start than to run.
      #
      # Tests first, for the reason the pair above gives. They matter more here:
      # the defect is invisible to every other tool, so a check that silently
      # stopped working would leave nothing watching at all.
      - run: python3 .github/scripts/test_check_orphan_docs.py

      - run: python3 .github/scripts/check_orphan_docs.py

      # The patterns the workflows use to read sbt's own output. A grep in YAML
      # has nothing behind it: a pattern that matches nothing looks exactly like
      # a log with nothing in it, so a guard built on one reports the absence of
      # evidence as evidence. `pypsa-drift.yml` anchored its sweep guard at `^`
      # against a line sbt colours, and reported "the sweep reported no cases"
      # over a log reading `0 failed, 0 ignored, 5 total` -- failing the weekly
      # drift run continuously, which is worse than a false alarm because a job
      # that always fails is a job nobody reads.
      #
      # Stdlib only and no sbt: the samples are real output, pinned.
      - run: python3 .github/scripts/test_workflow_log_patterns.py

      # The test-count pipeline. `count_tests.sh` is what both test jobs below
      # use to decide whether tests ran at all, so a break in it surfaces as a
      # floor failure reading "either the suite shrank or something stopped
      # running" -- a diagnosis about the suite for what is actually a broken
      # counter, which is the precise misdirection this apparatus exists to
      # prevent.
      #
      # It is here because the commit that added `test_count_tests.py` did not
      # wire it into any job, so it had never run: every other checker in
      # `.github/scripts/` is paired with a `- run:` line above, and that one
      # was not. An earlier version of this comment claimed the file replaced
      # five cases removed from the checker above; it did not. That checker's
      # case count has only ever gone up, and the five in question were added
      # and removed inside an unmerged branch, so a reader following the old
      # claim would have gone looking for coverage that never existed.
      - run: python3 .github/scripts/test_count_tests.py

  test:
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the current LTS floor; 25 is what the module is developed against.
        java: ["21", "25"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      # The sbt version itself comes from project/build.properties; this only
      # installs the runner script that reads it.
      - uses: sbt/setup-sbt@v1

      # sbt 2 joins all command-line arguments into a single command and parses
      # the result as one expression, so multiple commands must be quoted and
      # separated with semicolons. `sbt compile testFull` is a parse error.
      #
      # `testFull` rather than `test`: under sbt 2 the `test` task is
      # incremental and exits 0 having run nothing when caches are warm, which
      # would leave this job green while executing no tests.
      #
      # A green sbt run does not prove tests executed, so the count is asserted
      # from the same run's output. It has to be the same run: a second
      # `testFull` would find its work already done and legitimately report
      # zero, which is the very failure this guards against.
      - name: Compile and test
        run: |
          set -euo pipefail
          sbt --batch "Test/compile; testFull" 2>&1 | tee sbt-test.log
          # One script, tested beside itself, rather than two hand-verified
          # copies of a four-stage pipeline. `count_tests.sh` explains why it
          # reads two counters and takes the larger; `test_count_tests.py` pins
          # that against each real log state, including the replay that failed
          # this job on JDK 25.
          # Captured on its own line before being eval'd. `eval "$(cmd)"` of an
          # empty string returns 0, so a script that aborted would leave the
          # variables unset and the step would die on `set -u` two lines later
          # with "suites: unbound variable" rather than with the script's own
          # message.
          counts=$(.github/scripts/count_tests.sh sbt-test.log)
          eval "$counts"
          echo "test count: $suites from per-suite lines, $summary from sbt's summary"
          echo "Total tests run across all modules: $total"
          # A floor, not a bare "more than zero". `-lt 1` catches sbt reporting
          # success having run nothing, and nothing else: a change that silently
          # stopped running two thirds of the suite -- a module dropped from the
          # aggregate, a `Test/fork` setting that swallows a runner, an `assume`
          # that starts failing everywhere -- would sail past it, and the job that
          # exists to prove the tests ran would go green while most of them did
          # not.
          #
          # A *floor* rather than an exact count, because those fail differently.
          # An exact count breaks on every commit that adds a case, with an error
          # saying the tests did not run -- which is both wrong and how a check
          # gets muted. A floor only fails when coverage goes backwards, which is
          # when someone should look. Raise it when the suite grows enough to be
          # worth re-anchoring; it does not need to track the total.
          MINIMUM_TESTS=730
          if [ "$total" -lt "$MINIMUM_TESTS" ]; then
            echo "::error::Only $total tests ran, below the floor of $MINIMUM_TESTS -- either the suite shrank or something stopped running."
            exit 1
          fi
          echo "$total tests passed (floor $MINIMUM_TESTS)" >> "$GITHUB_STEP_SUMMARY"

      # prima-cyfra is not aggregated into root, because running it needs a
      # Vulkan stack no runner is guaranteed to have. Compiling it needs only
      # the Maven artifacts, and it reaches into prima-core's package-private
      # internals — so without this step a refactor there would break the
      # backend silently, and only surface the next time someone with a GPU
      # opened it.
      - name: Compile the GPU backend
        run: sbt --batch "primaCyfra/Test/compile"

      # prima-ortools is out of the root aggregate for a different reason --
      # `ortools-java` declares every platform's natives as runtime
      # dependencies -- and unlike Vulkan, the one this runner needs is on Maven
      # Central and loads here. So it is *run*, not merely compiled: a third
      # backend nothing exercises is code that looks right and has never been
      # asked the question it exists to answer, which is the failure this
      # repository has already been caught by once.
      - name: Test the OR-Tools backend
        run: |
          set -euo pipefail
          sbt --batch "primaOrtools/testFull" 2>&1 | tee sbt-ortools.log
          counts=$(.github/scripts/count_tests.sh sbt-ortools.log)
          eval "$counts"
          echo "OR-Tools test count: $suites from per-suite lines, $summary from sbt's summary"
          # A floor here too, and for the same reason: `testFull` exiting 0
          # having run nothing looks exactly like a passing suite.
          #
          # Set at the module's whole count, not at a fraction of it. The
          # aggregate floor above can afford 3% of slack because it covers
          # hundreds of cases across nine modules; here there are three suites,
          # and a floor with room for one of them to vanish would let
          # `SolverAgreementSuite` -- which is the only thing reaching across
          # all four backends at once -- or `PdlpComparisonSuite`, which is the
          # only check on Prima's iteration counts, stop reporting while the
          # step still went green. Raise it when the suite grows.
          MINIMUM_ORTOOLS_TESTS=16
          if [ "$total" -lt "$MINIMUM_ORTOOLS_TESTS" ]; then
            echo "::error::Only $total OR-Tools tests ran, below the floor of $MINIMUM_ORTOOLS_TESTS -- either the suite shrank or something stopped running."
            exit 1
          fi
          echo "$total OR-Tools tests passed (floor $MINIMUM_ORTOOLS_TESTS)"
          echo "$total OR-Tools tests passed (floor $MINIMUM_ORTOOLS_TESTS)" >> "$GITHUB_STEP_SUMMARY"

  # The lane-count question, which no machine here can answer.
  #
  # `VectorKernels` was measured on Apple Silicon, where `SPECIES_PREFERRED` is
  # two doubles -- the narrowest useful width. Whether widening is worth enabling
  # by default turns almost entirely on what it does at four or eight lanes, and
  # this is the only x86_64 in the project.
  #
  # Reported, never gated, exactly as `validation-report` is. A benchmark on a
  # shared runner is not a number to fail a build on: the runner's neighbours are
  # invisible and the variance is unbounded. What it is good for is the *ratio*
  # between two backends measured minutes apart on the same machine, which is the
  # only comparison this job makes.
  kernel-split:
    name: Kernel split and SIMD ratio (x86_64)
    runs-on: ubuntu-latest
    # Reported, never gated -- and now actually so. The comment said this while
    # `set -euo pipefail` and no `continue-on-error` meant any sbt failure turned
    # the job red on every PR: a benchmark that can block a merge is a gate
    # whatever its comment says.
    continue-on-error: true
    # A backstop, not the working limit. `continue-on-error` does not cover this:
    # exceeding `timeout-minutes` *cancels* the job, a cancelled job carries the
    # whole run to `cancelled` whatever this flag says, and the pull request then
    # reads UNSTABLE -- so the benchmark gated a merge twice while its own comment
    # said it never could. Cancellation also skips `if: always()`, so `Publish`
    # never ran and the partial measurements were thrown away.
    #
    # The budget that actually bites is per-invocation, inside `Measure`, where
    # overrunning is an ordinary step failure that `continue-on-error` does
    # swallow and `Publish` still runs after.
    #
    # 80, because fourteen invocations at the 300 s cap is 70 minutes plus setup.
    # This said 50 while quoting "fourteen at 180 s is 42 minutes" -- true of the
    # cap it was written for and false the moment that cap moved, which put the
    # backstop back within reach of four wedged invocations. Reaching it is not a
    # tolerable outcome here: cancellation skips `if: always()`, so it would
    # discard the summary *and* the thread dumps, which is the evidence the
    # watchdog above exists to collect.
    #
    # The cost is that a job wedged beyond `timeout`'s reach now occupies a runner
    # for eighty minutes rather than fifty. That is worth paying once at 4%
    # incidence to keep the diagnosis, on a job that gates nothing.
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Measure
        env:
          WEDGE_PASS: ${{ inputs.wedge_kernel_pass }}
        run: |
          set -euo pipefail
          # ABBA, not ABAB. Interleaving alone does not counterbalance: with
          # `scala vector` twice, `vector` is always second within a pass, so
          # drift that is monotone over the job's life -- a neighbour ramping up,
          # page cache filling, thermal state -- lands systematically on one arm
          # rather than cancelling.
          run() {
            # `MaxVectorSize`, not "lanes": $3 is the flag's value in *bytes*, so
            # a two-lane run was logged as `lanes 16` and the reporter consumed
            # the same capture under a `MaxVectorSize` heading -- one number
            # labelled two incompatible ways, in a summary whose subject is not
            # conflating width quantities.
            echo "=== pass $1 backend $2 MaxVectorSize ${3:-default} ===" | tee -a split.log
            local opts=""
            [ -n "${3:-}" ] && opts="set networkLopf/Test/javaOptions += \"-XX:MaxVectorSize=$3\"; "
            # 300 s, from the measurements rather than from an average. Most
            # invocations take 26-31 s, but `vector` at `MaxVectorSize=16` takes
            # 70-74 s across every successful run, and the first invocation of the
            # job takes ~70 s because it compiles -- so the slowest legitimate one
            # is 74 s and the cap is four times that. An earlier version said 180 s
            # was "five times a ~37 s invocation": 37 s is the mean over fourteen
            # passes, which is not a bound on any of them, and 180 s was 2.4x the
            # arm that actually wedges.
            #
            # Sized against a false truncation rather than against a wedge. The
            # wedge this exists for ran 46 minutes -- 37x the slowest legitimate
            # invocation -- so anything from two minutes upward catches it, while
            # a cap too close to 74 s throws away a real measurement and prints
            # "incomplete" over a sweep that was fine.
            #
            # No arithmetic against `timeout-minutes` here. An earlier version
            # picked the cap so fourteen of them fit inside the job budget, which
            # sized the cap to make a sentence true; if enough invocations wedge to
            # reach the backstop, the benchmark has nothing left to say and the
            # backstop firing is the right outcome.
            #
            # `|| true` on the marker, and the failure recorded outside
            # `split.log`: the reporter parses that file, and a line it does not
            # expect is a second failure mode bolted onto the first.
            #
            # A thread dump 60 s before the cap, so the next wedge is diagnosable.
            # This one produced 46 minutes of nothing: no output, no crash, no
            # stack -- so what it was doing is still unknown, and the only way to
            # find out is to be holding a dump the next time it happens. The
            # watchdog is killed on the normal path, where nothing runs long
            # enough for it to fire.
            # The sentinel, not just the `kill` below. Whether killing a sleeping
            # subshell wins the race is a detail of the shell, and a watchdog that
            # survives its pass fires 240 s into a *later* one and files a dump
            # against the wrong arm -- evidence that points somewhere else is
            # worse than none. Checking the sentinel makes a stray watchdog inert
            # regardless of who won.
            # Pass-scoped, not merely present. `.pass-running` carried no identity
            # and the next pass recreated it, so a stray watchdog waking during a
            # later pass found the file there and would have filed a dump under
            # its own stale labels -- the wrong-arm attribution the comment above
            # claimed it prevented. Comparing a token written before backgrounding
            # means only the pass that wrote it can dump.
            # The deliberate wedge, when dispatched with `wedge_kernel_pass`.
            #
            # A tighter tolerance rather than a `sleep`, because the part that
            # needs proving on a runner is that `jcmd -l | grep -E
            # "KernelSplit|sbt-launch"` matches the real JVM's command line and
            # that the attach returns a real dump. Sleeping in front of sbt would
            # mean no JVM exists when the watchdog wakes, so it would find nothing
            # and the test would pass while proving the opposite of what it claims.
            # `maxIterations` is 500,000 and the tolerance drives the iteration
            # count, so 1e-14 keeps a genuine KernelSplit JVM doing genuine work
            # well past 150 s.
            local tol="1e-4"
            if [ "${WEDGE_PASS:-}" = "$1" ]; then
              tol="1e-14"
              echo "=== pass $1 backend $2: wedged on purpose (tolerance $tol) ===" | tee -a split.log
            fi
            local token="$1-$2-${3:-default}-$$-$RANDOM"
            echo "$token" > .pass-running
            ( sleep 150
              [ "$(cat .pass-running 2>/dev/null)" = "$token" ] || exit 0
              # `jcmd -l` enumerates JVMs. `pgrep -f` matched the
              # `timeout 300 sbt --batch "...KernelSplit..."` process itself and
              # the sbt wrapper -- neither a JVM -- and `jcmd` against those wrote
              # its own error text into the dump.
              captured=$(mktemp); errs=$(mktemp)
              # Flush whatever was collected if this subshell is killed mid-loop.
              # `run()` SIGTERMs it the moment the pass ends, and without this the
              # write below never runs: a dump taken from the first of two JVMs was
              # discarded along with the temp file, which is the empty `stacks.txt`
              # this whole block exists to stop.
              flush() {
                if grep -q "Full thread dump" "$captured" 2>/dev/null; then
                  { echo "=== pass $1 $2 ${3:-default}: still running at 150 s ==="
                    cat "$captured"
                  } | tee -a stacks.txt
                fi
                rm -f "$captured" "$errs"
              }
              trap "flush $1 $2 ${3:-default}; exit 0" TERM INT
              for jvm in $(jcmd -l 2>/dev/null | grep -E "KernelSplit|sbt-launch" | cut -d" " -f1); do
                # 150 s and 30 s, not 240 s and 60 s. The fallback has to land while
                # sbt, the JVM and the `tee` that carries its stdout are all still
                # alive: at 240+60 the SIGQUIT fired at exactly the instant
                # `timeout 300` reaped all three, so it raced a JVM being torn down
                # and its output had nowhere left to go. 150+30 leaves two minutes.
                rc=0
                timeout 30 jcmd "$jvm" Thread.print >> "$captured" 2>>"$errs" || rc=$?
                if [ "$rc" -eq 124 ]; then
                  # Only 124 is the hang the fallback is for. Reporting every
                  # failure as "did not return in 60 s" described an attach that
                  # failed instantly as a timeout.
                  echo "jcmd on $jvm did not return in 30 s -- SIGQUIT sent, stack goes to split.log" >> "$errs"
                  kill -3 "$jvm" 2>/dev/null || true
                elif [ "$rc" -ne 0 ]; then
                  # Routine: a new JVM starts every pass, so one can exit between
                  # `jcmd -l` and the attach.
                  echo "jcmd on $jvm failed with exit $rc without hanging" >> "$errs"
                fi
              done
              # `Full thread dump`, not `-s`. Errors went into the same file as the
              # stacks, so an exception trace from a JVM that had already exited
              # made it non-empty and the summary rendered a "Thread dumps" block
              # containing only error text -- the condition the `-s` guard was
              # introduced to fix, reintroduced by the redirect beside it.
              flush "$1" "$2" "${3:-default}"
              [ -s "$errs" ] && cat "$errs" || true ) &
            local watchdog=$!
            if ! timeout 300 sbt --batch \
              "${opts}networkLopf/Test/runMain org.noaidi.lopf.KernelSplit scigrid-de $tol $2" \
              2>&1 | tee -a split.log
            then
              echo "pass $1 backend $2 MaxVectorSize ${3:-default}" >> truncated.txt
              echo "::warning::kernel-split pass $1/$2 did not finish within 300s"
            fi
            rm -f .pass-running
            kill "$watchdog" 2>/dev/null || true
            wait "$watchdog" 2>/dev/null || true
          }
          run 1 scala
          run 1 vector
          run 2 vector
          run 2 scala
          # Does widening the three SuperWord already handles win at this width?
          # Decided at two lanes, never tested at more.
          run 3 vector-all
          run 3 scala
          # Width on one machine. Both arms at each width, which the first
          # version got wrong: it ran only the vector arm width-limited and
          # compared it against a full-width scalar reference, so the ratio
          # mixed the width change with crippling SuperWord on the scalar side.
          # `-XX:MaxVectorSize` bounds C2's auto-vectorisation too, not just the
          # Vector API, so a width-limited run is only comparable to another
          # width-limited run.
          run 4 scala 16
          run 4 vector 16
          run 5 vector 16
          run 5 scala 16
          run 6 scala 32
          run 6 vector 32
          run 7 vector 32
          run 7 scala 32

      # The reporter before the report, as `action-pins` and the drift job both
      # do. Its failure mode is publishing a plausible number computed from the
      # wrong thing, which is what it was written to stop.
      - name: Test the reporter
        run: python3 .github/scripts/test_kernel_split_report.py

      - name: Publish
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f split.log ]; then
            echo "## Kernel split: no measurements" >> "$GITHUB_STEP_SUMMARY"
            echo "The measure step produced no log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Named before the table rather than after it. A sweep missing an arm
          # still prints rows, and rows under a heading that says nothing about
          # what is absent read as the whole measurement -- which is the reading
          # the ratios below are least able to survive, since an arm is only
          # comparable to its counterpart at the same width.
          if [ -f truncated.txt ]; then
            {
              echo "## Kernel split: incomplete"
              echo
              echo "These invocations did not finish inside the per-run budget and are"
              echo "missing from everything below. Their counterpart arms are present, so"
              echo "any ratio quoting one of these widths is comparing against nothing."
              echo
              sed 's/^/- /' truncated.txt
              echo
              if [ ! -s stacks.txt ]; then
                # Not "killed by something other than its own slowness", which is
                # what this said and could not know: an attach that never returns
                # leaves no dump either, and that is the failure mode the wedge
                # this hunts would produce.
                echo "No thread dump was captured: either the invocation stopped before"
                echo "the watchdog reached 240 s, or every attach and SIGQUIT failed."
                echo
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Outside the truncation block, deliberately. A pass that crosses 240 s
          # and still finishes inside the cap leaves a dump and no truncation
          # record -- an arm genuinely slower than the 74 s the cap is sized
          # against, which is the near miss most worth seeing and which nothing
          # else reports. Nested, its stack was collected and then thrown away
          # with the workspace.
          if [ -s stacks.txt ]; then
            dump_lines=$(wc -l < stacks.txt)
            {
              # Neutral, because `truncated.txt` is job-global and `stacks.txt`
              # accumulates across passes. Choosing the heading from it published a
              # near-miss dump from pass 2 under "taken before the cap" whenever
              # some *other* pass was the one truncated -- the wrong-arm
              # attribution the per-pass sentinel guards against, one level up. The
              # per-dump headers inside the block already say which pass each is.
              echo "<details><summary>Thread dumps from passes still running at 150 s</summary>"
              echo
              echo '```'
              head -800 stacks.txt
              if [ "$dump_lines" -gt 800 ]; then
                # Said, not silent. One JVM dump runs to several hundred lines and
                # this file accumulates one per slow pass, so a fixed head cuts the
                # later ones mid-stack -- and a stack that stops mid-frame reads as
                # a complete one.
                #
                # The pointer is true now and was not before: the watchdog wrote
                # only to files, so nothing reached the step log and this note sent
                # the reader somewhere the text did not exist. It `tee`s now.
                echo
                echo "... $((dump_lines - 800)) of $dump_lines lines omitted."
                echo "The full text is in the Measure step's log, which the watchdog tees to."
              fi
              echo '```'
              echo "</details>"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Captured rather than piped straight out, so an empty match is a
          # warning instead of a silently empty code block. sbt sends a forked
          # run's output through its logger on some configurations, so the
          # prefix is optional rather than assumed absent.
          # Split across two patterns rather than one 190-character alternation:
          # the header lines the harness prints, and the per-operation rows. The
          # `[info] ` prefix is optional for the reason given just above.
          headers='^(\[info\] )?(===|scigrid-de:|backend:|status |cold solve|iterations |wall clock|timing overhead)'
          oprows='^(\[info\] )?  [a-zA-Z]+ +[0-9]|sparse .*dense'
          rows=$(grep -E "$headers|$oprows" split.log || true)
          if [ -z "$rows" ]; then
            echo "::warning::the summary filter matched nothing; publishing the raw tail"
            rows=$(tail -60 split.log)
          fi
          {
            echo "## Kernel split on x86_64"
            echo
            echo "Backend names carry the lane count and the coverage:"
            echo "\`scala-vector-N\` widens three operations, \`scala-vector-N-all\` widens six."
            echo
            echo '```'
            echo "$rows"
            echo '```'
            echo
            python3 .github/scripts/kernel_split_report.py split.log
          } >> "$GITHUB_STEP_SUMMARY"

  # Prima's answers are only meaningful next to an independent solver's, so the
  # cross-check against ojAlgo is surfaced as its own job rather than buried in
  # the test output.
  validation-report:
    name: Solver validation report (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two JDKs on the same OS, so the reported objective gap has a second
        # data point holding platform fixed. The gap differs between the macOS
        # and Linux configurations and the natural explanation is summation
        # order, but the two configurations differ in JDK as well as
        # architecture — this at least separates those.
        java: ["21", "25"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Prima vs ojAlgo
        run: |
          set -euo pipefail
          sbt --batch "primaValidation/Test/runMain org.noaidi.prima.validation.Report" \
            | tee report.txt

      # The mixed-integer counterpart. Kept as a separate step so a MILP
      # regression is attributed to branch-and-bound rather than to the LP
      # solver, and because this report exits non-zero on disagreement -- the
      # search rests on an inexact bound, so a silent divergence from an exact
      # oracle is the failure that matters most.
      - name: Prima vs ojAlgo (mixed-integer)
        run: |
          set -euo pipefail
          sbt --batch "primaValidation/Test/runMain org.noaidi.prima.validation.MilpReport" \
            | tee milp-report.txt

      - name: Publish report to the job summary
        if: always()
        run: |
          # `sed -n` exits 0 when its address never matches, so the `|| cat`
          # fallback is what stops the summary publishing an empty block when the
          # header changes. It is not a hypothetical: `instance .*size .*status`
          # matched nothing, because this report's first header carries `size` and
          # its later ones carry `status` and no line has both. The fallback has
          # been publishing the whole file, correctly and silently, while the
          # comment here claimed it was dead code.
          #
          # `^instance ` rather than a column list, so a reordered or renamed
          # column does not send this back to the fallback.
          #
          # The anchor is safe because sbt colours the lines *it* logs and passes
          # a program's own stdout through untouched, and this table is printed
          # by `Report`'s `println`. Not because of `Test / fork`: an earlier
          # version of this comment said so, and `primaValidation` does not set
          # it -- the claim was wrong about the one module that writes this file.
          # The `|| cat` below is what covers the case where that reasoning is
          # wrong anyway, which is the whole reason it is not dead code.
          body=$(sed -n '/^instance /,$p' report.txt)
          if [ -z "$body" ]; then
            # Which path was taken, said out loud. Both produce a passing job and
            # a plausible summary, so nothing distinguished them and the previous
            # pattern sat here broken for as long as it took a reviewer to read
            # it. The fallback is correct behaviour, not a failure -- it publishes
            # the whole file -- but a fallback firing every run means the pattern
            # above matches nothing, and that should be visible without someone
            # going to look.
            echo "::warning::the report summary fell back to the whole file: /^instance / matched nothing in report.txt"
            body=$(cat report.txt)
          else
            echo "::notice::the report summary matched /^instance / and published the table"
          fi
          {
            echo "## Prima vs ojAlgo (JDK ${{ matrix.java }})"
            echo
            echo '```'
            echo "$body"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The MILP table too, and guarded on the file existing because that
          # step exits non-zero on disagreement -- which is exactly when someone
          # needs to see *which* instance diverged, rather than reading raw job
          # logs while the summary shows the LP report as if nothing happened.
          if [ -f milp-report.txt ]; then
            # `^instance ` for the reason the LP block above gives. This one
            # does match today -- the MILP header happens to carry `size` and
            # `int` in that order -- which is exactly how its sibling looked
            # until a column moved.
            milp=$(sed -n '/^instance /,$p' milp-report.txt)
            if [ -z "$milp" ]; then
              echo "::warning::the MILP summary fell back: /^instance / matched nothing in milp-report.txt"
            else
              echo "::notice::the MILP summary matched /^instance /"
            fi
            [ -n "$milp" ] || milp=$(cat milp-report.txt)
            {
              echo "## Prima vs ojAlgo, mixed-integer (JDK ${{ matrix.java }})"
              echo
              echo '```'
              echo "$milp"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
