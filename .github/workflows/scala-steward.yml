name: Scala Steward

on:
  schedule:
    # Mondays at 06:00 UTC. Weekly keeps the review load small enough that the
    # PRs actually get looked at.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scala-steward:
    name: Propose dependency updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: scala-steward-org/scala-steward-action@v2
        with:
          # The default GITHUB_TOKEN cannot open pull requests that trigger
          # other workflows, so Steward's PRs would never be built. A PAT with
          # `repo` scope, or a GitHub App installation token, is required for CI
          # to run on what it opens.
          github-token: ${{ secrets.SCALA_STEWARD_TOKEN }}
          repo-config: .scala-steward.conf
