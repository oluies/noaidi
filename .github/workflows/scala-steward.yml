name: Scala Steward

on:
  schedule:
    # Mondays at 06:00 UTC. Weekly keeps the review load small enough that the
    # PRs actually get looked at.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scala-steward:
    name: Propose dependency updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: scala-steward-org/scala-steward-action@v2.92.0
        with:
          # The default GITHUB_TOKEN cannot open pull requests that trigger
          # other workflows, so Steward's PRs would never be built. A PAT with
          # `repo` scope, or a GitHub App installation token, is required for CI
          # to run on what it opens.
          github-token: ${{ secrets.SCALA_STEWARD_TOKEN }}
          repo-config: .scala-steward.conf
          # Steward needs an author for the commits it makes, and derives one
          # from the token's account by default. That fails outright when the
          # account has email privacy enabled — which is the sensible setting,
          # so the address is supplied here rather than the privacy turned off.
          # GitHub's noreply form routes to the account without exposing a real
          # address.
          author-email: "150961+oluies@users.noreply.github.com"
          author-name: "Scala Steward"
