# Scala Steward configuration.
# https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md
#
# Steward owns the Scala side: sbt dependencies, plugins and the sbt and Scala
# versions themselves. Dependabot (.github/dependabot.yml) owns the `uses:` pins
# in the workflows. The two cannot collide — Dependabot has no sbt ecosystem, so
# it cannot see build.sbt at all.

# Matches the workflow's weekly schedule. More often than this and the PRs stop
# getting read, which defeats the point of having them.
pullRequests.frequency = "@weekly"

# Enough headroom for a normal week's updates without burying the queue.
updates.limit = 8

commits.message = "Update ${artifactName} from ${currentVersion} to ${nextVersion}"

updates.pin = [
  # Cyfra, the intended GPU backend, is published for Scala 3.6.4, so a Scala
  # line move needs someone to check that its TASTy still reads. That check was
  # made for 3.9.0 -- `primaCyfra` compiles against those artifacts and its 20
  # tests pass on a host with a Vulkan stack -- so the pin follows the build onto
  # the 3.9.x line rather than being dropped. Steward proposes patches within the
  # line; moving off it stays a deliberate decision, which is the whole point of
  # the pin. `primaCyfra/Test/compile` in CI is what would fail if a future
  # compiler refused that TASTy.
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.9." }
]

pullRequests.customLabels = ["dependencies"]

# Worth knowing when reviewing these: Prima is validated against ojAlgo, so an
# ojAlgo bump moves the oracle rather than the subject. A red validation suite
# on such a PR means the reference implementation changed its answer, which is
# exactly the signal that suite exists to give -- but it reads at first glance
# as though Prima broke.

