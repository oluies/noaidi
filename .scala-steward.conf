# Scala Steward configuration.
# https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

# Matches the workflow's weekly schedule. More often than this and the PRs stop
# getting read, which defeats the point of having them.
pullRequests.frequency = "@weekly"

# Enough headroom for a normal week's updates without burying the queue.
updates.limit = 8

commits.message = "Update ${artifactName} from ${currentVersion} to ${nextVersion}"

updates.pin = [
  # Cyfra, the intended GPU backend, is published for Scala 3.6.4. Staying on
  # the 3.7.x line keeps its TASTy readable; moving to 3.8+ is a decision to
  # take deliberately after checking that compatibility, not one to take from a
  # dependency-bump PR.
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.7." }
]

pullRequests.customLabels = ["dependencies"]

# Worth knowing when reviewing these: Prima is validated against ojAlgo, so an
# ojAlgo bump moves the oracle rather than the subject. A red validation suite
# on such a PR means the reference implementation changed its answer, which is
# exactly the signal that suite exists to give -- but it reads at first glance
# as though Prima broke.

